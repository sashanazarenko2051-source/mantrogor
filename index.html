<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANTROGOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07060f">
<meta name="description" content="MANTROGOR – tvorba webů, Telegram botů a aplikací na míru. Pevná cena, první měsíc hostingu v ceně.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MANTROGOR">
<meta property="og:title" content="MANTROGOR – weby, boti, aplikace">
<meta property="og:description" content="Weby od $150, Telegram boti od $100, aplikace na míru. Pevná cena, první měsíc hostingu v ceně.">
<meta property="og:image" content="https://sashanazarenko2051-source.github.io/mantrogor/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://sashanazarenko2051-source.github.io/mantrogor/">
<meta property="og:locale" content="cs_CZ">
<meta name="twitter:card" content="summary_large_image">
</head>
<body data-page="index.html" data-title="home">
<header id="site-header"></header>

<main>
  <div class="wrap">
    <section class="hero">
      <div class="prompt">mantrogor@studio:~$ <b>build</b> --site --bot --app <span class="caret"></span></div>
      <h1 class="glitch" data-text="MANTROGOR">MANTROGOR</h1>
      <p class="hero-sub" data-i18n-html="hero_sub"></p>
      <div class="cta-row">
        <a class="btn" href="calc.html" data-i18n="cta_calc"></a>
        <a class="btn ghost" href="prices.html" data-i18n="cta_prices"></a>
      </div>
      <div class="stats">
        <div><div class="n" data-i18n="st1n"></div><div class="t" data-i18n="st1t"></div></div>
        <div><div class="n" id="minOrder">—</div><div class="t" data-i18n="st2t"></div></div>
        <div><div class="n" data-i18n="st3n"></div><div class="t" data-i18n="st3t"></div></div>
        <div><div class="n">50 / 50</div><div class="t" data-i18n="st4t"></div></div>
      </div>
    </section>
  </div>

  <section class="block">
    <div class="wrap">
      <div class="sec-head">
        <span class="label">// directions</span>
        <h2 data-i18n="dir_title"></h2>
      </div>
      <div class="services" id="svcCards"></div>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <div class="sec-head sec-head-row">
        <div style="display:grid;gap:12px">
          <span class="label">// portfolio</span>
          <h2 data-i18n="proj_title"></h2>
        </div>
        <a class="btn small ghost" href="projects.html"><span data-i18n="proj_all"></span> →</a>
      </div>
      <div class="projects" id="projCards"></div>
    </div>
  </section>

  <section class="block">
    <div class="wrap">
      <div class="sec-head">
        <span class="label">// process</span>
        <h2 data-i18n="proc_title"></h2>
      </div>
      <div class="steps">
        <div class="step"><span class="num">01</span><h3 data-i18n="s1t"></h3><p data-i18n="s1p"></p></div>
        <div class="step"><span class="num">02</span><h3 data-i18n="s2t"></h3><p data-i18n="s2p"></p></div>
        <div class="step"><span class="num">03</span><h3 data-i18n="s3t"></h3><p data-i18n="s3p"></p></div>
        <div class="step"><span class="num">04</span><h3 data-i18n="s4t"></h3><p data-i18n="s4p"></p></div>
        <div class="step"><span class="num">05</span><h3 data-i18n="s5t"></h3><p data-i18n="s5p"></p></div>
      </div>
    </div>
  </section>

  <section class="cta-band">
    <div class="wrap">
      <h2 data-i18n="band_home"></h2>
      <a class="btn" href="contacts.html" data-i18n="band_home_btn"></a>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
  const { data, fmt, esc, minPrice, t, tr } = M;
  document.getElementById("minOrder").textContent = fmt(Math.min(...data.services.map(minPrice)));
  document.getElementById("svcCards").innerHTML = data.services.map(s => `
    <a class="svc" href="services.html#${esc(s.id)}">
      <span class="code">${esc(s.code)}</span>
      <h3>${esc(tr(s.title))}</h3>
      <p>${esc(tr(s.desc))}</p>
      <div class="from">${esc(t("from"))} ${fmt(minPrice(s))} →</div>
    </a>`).join("");
  document.getElementById("projCards").innerHTML = (data.projects || []).slice(0, 2).map(M.projectCard).join("");
</script>
</body>
</html>
