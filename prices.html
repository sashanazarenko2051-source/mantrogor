<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANTROGOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07060f">
<meta name="description" content="MANTROGOR – tvorba webů, Telegram botů a aplikací na míru. Pevná cena, první měsíc hostingu v ceně.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MANTROGOR">
<meta property="og:title" content="MANTROGOR – weby, boti, aplikace">
<meta property="og:description" content="Weby od $150, Telegram boti od $100, aplikace na míru. Pevná cena, první měsíc hostingu v ceně.">
<meta property="og:image" content="https://sashanazarenko2051-source.github.io/mantrogor/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://sashanazarenko2051-source.github.io/mantrogor/">
<meta property="og:locale" content="cs_CZ">
<meta name="twitter:card" content="summary_large_image">
</head>
<body data-page="prices.html" data-title="nav_prices">
<header id="site-header"></header>

<main>
  <div class="wrap">
    <div class="page-head">
      <div class="prompt">mantrogor@studio:~$ <b>cat</b> prices.txt</div>
      <h1 data-i18n="nav_prices"></h1>
      <p data-i18n="pr_lead"></p>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tiers" id="tiers" role="tabpanel"></div>
    <p class="note" data-i18n="pr_note"></p>
  </div>

  <section class="block" style="margin-top:48px">
    <div class="wrap">
      <div class="sec-head">
        <span class="label">// add-ons</span>
        <h2 data-i18n="extras_title"></h2>
        <p data-i18n="extras_lead"></p>
      </div>
      <div class="extras-table" id="extras"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
  const { data, fmt, esc, t, tr, days } = M;
  const tabsEl = document.getElementById("tabs"), tiersEl = document.getElementById("tiers");
  tabsEl.innerHTML = data.services.map(s =>
    `<button class="tab" role="tab" id="tab-${esc(s.id)}" data-id="${esc(s.id)}" aria-selected="false">${esc(tr(s.title))}</button>`).join("");

  function show(id) {
    const s = data.services.find(x => x.id === id) || data.services[0];
    tabsEl.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === s.id)));
    tiersEl.setAttribute("aria-labelledby", "tab-" + s.id);
    tiersEl.innerHTML = s.tiers.map(x => `
      <article class="tier${x.hot ? " hot" : ""}">
        ${x.hot ? `<span class="badge">${esc(t("hot"))}</span>` : ""}
        <h3>${esc(tr(x.name))}</h3>
        <div class="price"><small>${esc(t("from"))} </small>${fmt(x.price)}</div>
        <div class="term">${esc(t("term"))}: ${esc(days(Number(x.days) || 1))}</div>
        <ul>${tr(x.items).map(i => `<li>${esc(i)}</li>`).join("")}</ul>
        <div class="incl">✓ ${esc(t("hosting_incl"))}</div>
        <a class="btn small${x.hot ? "" : " ghost"}" href="contacts.html">${esc(t("discuss"))}</a>
      </article>`).join("");
  }
  tabsEl.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) show(b.dataset.id); });
  show(location.hash.slice(1));

  document.getElementById("extras").innerHTML = data.extras.map(x =>
    `<div><span>${esc(tr(x.name))}</span><span>+${fmt(x.price)}</span></div>`).join("");
</script>
</body>
</html>
