<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANTROGOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07060f">
<meta name="description" content="MANTROGOR – tvorba webů, Telegram botů a aplikací na míru. Pevná cena, první měsíc hostingu v ceně.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MANTROGOR">
<meta property="og:title" content="MANTROGOR – weby, boti, aplikace">
<meta property="og:description" content="Weby od $150, Telegram boti od $100, aplikace na míru. Pevná cena, první měsíc hostingu v ceně.">
<meta property="og:image" content="https://sashanazarenko2051-source.github.io/mantrogor/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://sashanazarenko2051-source.github.io/mantrogor/">
<meta property="og:locale" content="cs_CZ">
<meta name="twitter:card" content="summary_large_image">
</head>
<body data-page="services.html" data-title="nav_services">
<header id="site-header"></header>

<main>
  <div class="wrap">
    <div class="page-head">
      <div class="prompt">mantrogor@studio:~$ <b>ls</b> ./services</div>
      <h1 data-i18n="nav_services"></h1>
      <p data-i18n="svc_lead"></p>
    </div>
    <div class="svc-rows" id="svcRows"></div>
  </div>

  <section class="cta-band" style="margin-top:64px">
    <div class="wrap">
      <h2 data-i18n="band_svc"></h2>
      <a class="btn" href="contacts.html" data-i18n="band_svc_btn"></a>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
  const { data, fmt, esc, minPrice, t, tr } = M;
  document.getElementById("svcRows").innerHTML = data.services.map(s => `
    <article class="svc-row" id="${esc(s.id)}">
      <div class="info">
        <span class="label">${esc(s.code)}</span>
        <h2>${esc(tr(s.title))}</h2>
        <p>${esc(tr(s.desc))}</p>
        <ul>${tr(s.bullets).map(b => `<li>${esc(b)}</li>`).join("")}</ul>
        <div class="cta-row"><a class="btn small" href="prices.html#${esc(s.id)}">${esc(t("svc_tiers_from"))} ${fmt(minPrice(s))}</a></div>
      </div>
      <div class="mini-tiers">
        ${s.tiers.map(x => `<div><span>${esc(tr(x.name))}</span><span>${esc(t("from"))} ${fmt(x.price)}</span></div>`).join("")}
      </div>
    </article>`).join("");
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
