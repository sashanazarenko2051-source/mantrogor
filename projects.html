<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07060f">
<meta name="description" content="MANTROGOR – tvorba webů, Telegram botů a aplikací na míru. Pevná cena, první měsíc hostingu v ceně.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MANTROGOR">
<meta property="og:title" content="MANTROGOR – projekty">
<meta property="og:description" content="Funkční weby, e-shopy a aplikace, které si můžete hned otevřít a vyzkoušet.">
<meta property="og:image" content="https://sashanazarenko2051-source.github.io/mantrogor/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://sashanazarenko2051-source.github.io/mantrogor/projects.html">
<meta property="og:locale" content="cs_CZ">
<meta name="twitter:card" content="summary_large_image">
</head>
<body data-page="projects.html" data-title="nav_projects">
<header id="site-header"></header>

<main>
  <div class="wrap">
    <div class="page-head">
      <div class="prompt">mantrogor@studio:~$ <b>ls</b> ./projects</div>
      <h1 data-i18n="nav_projects"></h1>
      <p data-i18n="proj_lead"></p>
    </div>
    <div class="filters">
      <div class="filter-row" id="catRow" role="group"></div>
      <div class="filter-row" id="techRow" role="group"></div>
    </div>
    <div class="projects" id="projList" style="padding-bottom:64px"></div>
  </div>

  <section class="cta-band">
    <div class="wrap">
      <h2 data-i18n="band_home"></h2>
      <a class="btn" href="contacts.html" data-i18n="band_home_btn"></a>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
  const { data, esc, t, tr, projectCard } = M;
  const all = data.projects || [];
  const cats = data.services.filter(s => all.some(p => p.cat === s.id));
  const techs = [...new Set(all.flatMap(p => p.tags || []))]
    .sort((a, b) => all.filter(p => p.tags.includes(b)).length - all.filter(p => p.tags.includes(a)).length || a.localeCompare(b));
  // Категория из ссылки: projects.html#bot
  let cat = cats.some(s => s.id === location.hash.slice(1)) ? location.hash.slice(1) : "";
  let tech = "";

  const chip = (kind, value, label, n, on) =>
    `<button type="button" class="chip" data-${kind}="${esc(value)}" aria-pressed="${on}">${label}<span class="n">${n}</span></button>`;

  function render() {
    const inCat = all.filter(p => !cat || p.cat === cat);
    document.getElementById("catRow").innerHTML = `<span class="label">${esc(t("f_cat"))}</span>` +
      chip("cat", "", esc(t("cat_all")), all.length, cat === "") +
      cats.map(s => chip("cat", s.id, esc(tr(s.title)), all.filter(p => p.cat === s.id).length, cat === s.id)).join("");
    document.getElementById("techRow").innerHTML = `<span class="label">${esc(t("f_tech"))}</span>` +
      techs.map(x => [x, inCat.filter(p => p.tags.includes(x)).length])
        .filter(([x, n]) => n > 0 || tech === x)
        .map(([x, n]) => chip("tech", x, esc(x), n, tech === x)).join("");
    const list = inCat.filter(p => !tech || p.tags.includes(tech));
    document.getElementById("projList").innerHTML = list.length ? list.map(projectCard).join("") :
      `<div class="proj-empty">${esc(t("proj_none"))} <button type="button" class="btn small ghost" data-reset="1">${esc(t("proj_reset"))}</button></div>`;
  }

  document.querySelector(".filters").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.cat !== undefined) { cat = b.dataset.cat; history.replaceState(null, "", cat ? "#" + cat : location.pathname + location.search); }
    if (b.dataset.tech !== undefined) tech = tech === b.dataset.tech ? "" : b.dataset.tech;
    render();
  });
  document.getElementById("projList").addEventListener("click", e => {
    if (e.target.closest("[data-reset]")) { cat = ""; tech = ""; render(); }
  });
  render();
</script>
</body>
</html>
