<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANTROGOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="calc.html" data-title="nav_calc">
<header id="site-header"></header>

<main>
  <div class="wrap">
    <div class="page-head">
      <div class="prompt">mantrogor@studio:~$ <b>estimate</b> --project</div>
      <h1 data-i18n="nav_calc"></h1>
      <p data-i18n="calc_lead"></p>
    </div>
    <div class="calc" style="padding-bottom:64px">
      <form class="calc-form" id="calcForm">
        <fieldset>
          <legend class="label" data-i18n="calc_what"></legend>
          <p class="calc-hint" data-i18n="calc_hint"></p>
          <div id="calcType" style="display:grid;gap:14px"></div>
        </fieldset>
        <fieldset>
          <legend class="label" data-i18n="calc_extra"></legend>
          <div class="opts" id="calcExtras"></div>
        </fieldset>
        <fieldset>
          <legend class="label" data-i18n="calc_speed"></legend>
          <div class="opts" id="calcSpeed"></div>
        </fieldset>
      </form>
      <aside class="calc-out" aria-live="polite">
        <span class="label">// total</span>
        <div class="total" id="calcTotal">—</div>
        <div class="days" id="calcDays"></div>
        <div class="lines" id="calcLines"></div>
        <a class="btn" href="contacts.html" id="toOrder" data-i18n="to_order"></a>
      </aside>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
  const { data, fmt, esc, t, tr, days } = M;
  const SPEEDS = [
    { id: "normal", key: "sp_normal", k: 1, d: 1 },
    { id: "fast", key: "sp_fast", k: 1.3, d: 0.7 },
    { id: "rush", key: "sp_rush", k: 1.6, d: 0.5 }
  ];
  const opt = (name, type, value, label, checked) =>
    `<label class="opt"><input type="${type}" name="${name}" id="c-${name}-${value}" value="${value}"${checked ? " checked" : ""}><span>${label}</span></label>`;

  document.getElementById("calcType").innerHTML = data.services.map((s, si) => `
    <div style="display:grid;gap:8px">
      <span class="group-name">${esc(tr(s.title))}</span>
      <div class="opts">${s.tiers.map((x, ti) => opt("ctype-" + si, "checkbox", si + "-" + ti, esc(tr(x.name)) + " · " + fmt(x.price), si === 0 && ti === 0)).join("")}</div>
    </div>`).join("");
  // В каждом направлении — не больше одного тарифа; повторный клик снимает выбор.
  document.getElementById("calcType").addEventListener("change", e => {
    const box = e.target;
    if (box.checked) document.querySelectorAll(`[name="${box.name}"]`).forEach(o => { if (o !== box) o.checked = false; });
  });
  document.getElementById("calcExtras").innerHTML = data.extras.map((x, i) => opt("cextra", "checkbox", i, esc(tr(x.name)) + " · +" + fmt(x.price), false)).join("");
  document.getElementById("calcSpeed").innerHTML = SPEEDS.map((s, i) => opt("cspeed", "radio", s.id, esc(t(s.key)), i === 0)).join("");

  let summary = "", serviceTitle = "";
  function calc() {
    const f = document.getElementById("calcForm");
    const picked = [...f.querySelectorAll('[name^="ctype-"]:checked')].map(i => {
      const [si, ti] = i.value.split("-").map(Number);
      return { svc: data.services[si], x: data.services[si].tiers[ti] };
    });
    const toOrder = document.getElementById("toOrder");
    if (!picked.length) {
      document.getElementById("calcTotal").textContent = "—";
      document.getElementById("calcDays").textContent = "";
      document.getElementById("calcLines").innerHTML = `<div class="calc-warn">${esc(t("calc_pick"))}</div>`;
      toOrder.hidden = true;
      return;
    }
    toOrder.hidden = false;
    const ex = [...f.querySelectorAll('[name="cextra"]:checked')].map(i => data.extras[+i.value]);
    const s = SPEEDS.find(v => v.id === f.querySelector('[name="cspeed"]:checked').value);
    const sum = arr => arr.reduce((a, b) => a + (Number(b) || 0), 0);
    const base = sum(picked.map(p => p.x.price)) + sum(ex.map(e => e.price));
    const total = Math.round(base * s.k / 10) * 10;
    // Направления делаются параллельно: срок = самый долгий тариф + опции.
    const n = Math.max(2, Math.round((Math.max(...picked.map(p => Number(p.x.days) || 0)) + sum(ex.map(e => e.days))) * s.d));
    document.getElementById("calcTotal").textContent = "≈ " + fmt(total);
    document.getElementById("calcDays").textContent = t("term") + ": " + days(n);
    const lines = [...picked.map(p => [tr(p.x.name), fmt(p.x.price)]), ...ex.map(e => [tr(e.name), "+" + fmt(e.price)])];
    if (s.k > 1) lines.push([t("calc_speed") + " ×" + s.k, "+" + fmt(total - base)]);
    lines.push([t("hosting_line"), t("incl")]);
    document.getElementById("calcLines").innerHTML = lines.map(l => `<div><span>${esc(l[0])}</span><span>${esc(l[1])}</span></div>`).join("");
    serviceTitle = picked.length > 1 ? t("opt_combo") : tr(picked[0].svc.title);
    summary = `${picked.map(p => tr(p.svc.title) + ": " + tr(p.x.name)).join("; ")}${ex.length ? " + " + ex.map(e => tr(e.name)).join(", ") : ""}; ${t(s.key)}. ${t("estimate")}: ${fmt(total)}, ${days(n)}. ${t("hosting_incl")}.`;
  }
  document.getElementById("calcForm").addEventListener("change", calc);
  calc();
  document.getElementById("toOrder").addEventListener("click", () => {
    try { localStorage.setItem("mantrogor-calc", JSON.stringify({ service: serviceTitle, summary })); } catch (_) {}
  });
</script>
</body>
</html>
